name: Publish VacNet++ v4.5.1

on:
  push:
    branches: [main]
    paths:
      - extension/docs/releases/4.5.1.md

permissions:
  contents: write

concurrency:
  group: vacnet-release-4.5.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Verify release version
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('extension/package.json'));const l=JSON.parse(fs.readFileSync('extension/package-lock.json'));if(p.version!=='4.5.1'||l.version!=='4.5.1'||l.packages[''].version!=='4.5.1')process.exit(1)"
      - name: Install and check
        working-directory: extension
        run: |
          npm ci
          npm run check
      - name: Browser tests
        working-directory: extension
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Package browsers with license notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for browser in chrome firefox; do
            built="extension/.output/${browser}-mv3"
            test -f "$built/manifest.json"
            cp LICENSE "$built/LICENSE"
            cp extension/docs/ATTRIBUTION.md "$built/ATTRIBUTION.md"
            (cd "$built" && zip -q -r "$GITHUB_WORKSPACE/dist/vacnet-plus-plus-4.5.1-${browser}.zip" .)
          done
          for browser in chrome firefox; do
            archive="dist/vacnet-plus-plus-4.5.1-${browser}.zip"
            unzip -Z1 "$archive" | grep -Fxq 'LICENSE'
            unzip -Z1 "$archive" | grep -Fxq 'ATTRIBUTION.md'
            unzip -Z1 "$archive" | grep -Fxq 'manifest.json'
          done
          (cd dist && sha256sum vacnet-plus-plus-4.5.1-chrome.zip vacnet-plus-plus-4.5.1-firefox.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v4.5.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/vacnet-plus-plus-4.5.1-chrome.zip \
            dist/vacnet-plus-plus-4.5.1-firefox.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "VacNet++ 4.5.1" \
            --notes-file extension/docs/releases/4.5.1.md \
            --latest
